# PostGIS + Mailpit pentru dezvoltare locală.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: navigare
      POSTGRES_PASSWORD: navigare
      POSTGRES_DB: navigare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init_test_db.sql:/docker-entrypoint-initdb.d/20-init_test_db.sql:ro

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # interfața web

volumes:
  pgdata:
